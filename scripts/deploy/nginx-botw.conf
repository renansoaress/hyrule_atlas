# /etc/nginx/sites-available/botw_web.conf — instalado pelo scripts/deploy/deploy.mjs na primeira vez.
# O certbot acrescenta o bloco HTTPS (listen 443 ssl) e o redirecionamento de HTTP.
server {
  listen 80;
  listen [::]:80;
  server_name botw.renans.dev;

  # o bundle tem ~6 MB de JS (dados embutidos): comprimido cai para menos de 1 MB
  gzip on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

  location / {
    proxy_pass http://127.0.0.1:5510;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
